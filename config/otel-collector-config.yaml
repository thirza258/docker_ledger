receivers:
  # OTLP receiver for the existing tracing setup in telemetry.go
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape Docker JSON log files from the host
  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      # Parse the Docker JSON log format:
      # {"log":"message\n","stream":"stdout","time":"2026-07-12T..."}
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          # Docker writes RFC3339 with nanosecond precision; the Go layout
          # parses it exactly, where strptime's %f is fixed-width and fails on
          # the variable-length fraction Docker emits.
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"

      # Extract container_id from log file path
      # Path: /var/lib/docker/containers/<64-hex-id>/<64-hex-id>-json.log
      - type: regex_parser
        regex: '/containers/(?P<container_id>[a-f0-9]{64})/'
        parse_from: attributes["log.file.path"]

      # Move the actual log message from attributes.log to body
      - type: move
        from: attributes.log
        to: body

      # Set severity from stream: stdout → INFO, stderr → ERROR
      - type: add
        field: attributes.level
        value: INFO
        if: 'attributes.stream == "stdout"'
      - type: add
        field: attributes.level
        value: ERROR
        if: 'attributes.stream == "stderr"'

      # Clean up unnecessary attributes to reduce label cardinality
      - type: remove
        field: attributes.time
      - type: remove
        field: attributes.stream

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Add resource attributes so Loki has labels to work with
  resource:
    attributes:
      - key: service.name
        value: dockerledger
        action: upsert
      - key: deployment.environment
        value: dev
        action: upsert

  # Transform: attempt to parse JSON body for structured backend logs
  # If the body is valid JSON, promote level/service/request_id fields to attributes.
  transform:
    log_statements:
      - context: log
        statements:
          # Try to parse body as JSON; if successful, extract level and overwrite
          # the stream-based default, plus promote request_id for correlation.
          - set(attributes["_body_json"], ParseJSON(body)) where IsMatch(body, "^\\s*\\{")
          - set(attributes["level"], attributes["_body_json"]["level"]) where attributes["_body_json"] != nil
          - set(attributes["service_name"], attributes["_body_json"]["service"]) where attributes["_body_json"] != nil and attributes["_body_json"]["service"] != nil
          - set(attributes["request_id"], attributes["_body_json"]["request_id"]) where attributes["_body_json"] != nil and attributes["_body_json"]["request_id"] != nil
          # Trace correlation: the backend stamps these on every log line that
          # is emitted inside a span.
          - set(attributes["trace_id"], attributes["_body_json"]["trace_id"]) where attributes["_body_json"] != nil and attributes["_body_json"]["trace_id"] != nil
          - set(attributes["span_id"], attributes["_body_json"]["span_id"]) where attributes["_body_json"] != nil and attributes["_body_json"]["span_id"] != nil
          # Drop the scratch copy so the parsed map isn't shipped alongside the body.
          - delete_key(attributes, "_body_json")
          # Tell the loki exporter which record attributes to promote to Loki
          # labels. This hint replaces the exporter's removed `labels:` block;
          # keep the list short — every label is an index dimension.
          - set(attributes["loki.attribute.labels"], "container_id, level, service_name")

  # Drop noisy / low-value lines (P5 noise filtering).
  # These conditions match on the record body, which is NOT an attribute — the
  # previous `record_attributes` form with `key: body` matched nothing and let
  # all of this noise through to Loki.
  filter:
    error_mode: ignore
    logs:
      log_record:
        # Docker / app health-check probes
        - 'IsMatch(body, "/health/docker")'
        # GORM record-not-found (double-filtered; also handled in app)
        - 'IsMatch(body, "record not found")'
        # GORM slow-query trace noise at DEBUG level
        - 'IsMatch(body, "\"msg\":\"gorm query\"")'
        # Docker health-check exec probes
        - 'IsMatch(body, "healthcheck:")'

exporters:
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    # Labels are selected with the `loki.attribute.labels` hint set in the
    # transform processor above — this exporter no longer accepts a `labels`
    # block, and configuring one makes the collector refuse to start.

  debug:
    verbosity: basic

service:
  pipelines:
    logs:
      # No debug exporter here on purpose: the collector's own stdout is one of
      # the files filelog scrapes, so echoing every log record to stdout feeds
      # it straight back into the pipeline.
      receivers: [filelog]
      processors: [resource, transform, filter, batch]
      exporters: [loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
