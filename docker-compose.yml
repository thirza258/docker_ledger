services:
  postgres:
    image: postgres:16-alpine
    container_name: dockerledger-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dockerledger}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dockerledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockerledger

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dockerledger-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dockerledger}
      DB_SSLMODE: disable
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-your_api_key_here}
      SERVER_PORT: "8080"
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dockerledger

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dockerledger-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dockerledger

  # ── Observability stack ──────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: dockerledger-otel-collector
    user: "0:0"
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
    networks:
      - dockerledger

  loki:
    image: grafana/loki:3.1.0
    container_name: dockerledger-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
      - loki_rules:/loki/rules
    restart: unless-stopped
    networks:
      - dockerledger
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dockerledger-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3030}:3000"
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dockerledger

volumes:
  postgres_data:
  loki_data:
  loki_rules:
  grafana_data:

networks:
  dockerledger:
    driver: bridge
