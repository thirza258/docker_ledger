services:
  postgres:
    image: postgres:16-alpine
    container_name: dockerledger-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dockerledger}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dockerledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockerledger

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dockerledger-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dockerledger}
      DB_SSLMODE: disable
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-your_api_key_here}
      SERVER_PORT: "8080"
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dockerledger

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dockerledger-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dockerledger

volumes:
  postgres_data:

networks:
  dockerledger:
    driver: bridge
